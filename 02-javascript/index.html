<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="juego">
        <h1>Adivina el Número</h1>
        <p>Adivina un número del 1 al 100</p>

        <form id="formulario-juego" novalidate>
            <label for="entrada-numero">Escribe tu intento</label>
            <input
                id="entrada-numero"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                autofocus
            >
            <button id="boton-adivinar" type="submit">Adivinar</button>
        </form>

        <p id="mensaje-resultado" class="mensaje" role="status" aria-live="polite"></p>
        <p id="contador-intentos">Intentos: 0</p>

        <button id="boton-reiniciar" type="button">Reiniciar</button>
    </main>
</body>
</html>
